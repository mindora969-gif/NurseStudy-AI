<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NurseStudy AI — Alexa+ Simulation</title>
<style>
:root{--ink:#172033;--muted:#64748b;--card:#fff;--bg:#f4f7fb;--brand:#173b67;--accent:#00a8c6;--line:#dbe3ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#122f52,#1c5a82);color:#fff;padding:22px 18px}
.wrap{max-width:900px;margin:auto;padding:0 16px}header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px}
h1{margin:0;font-size:28px}.sub{margin:5px 0 0;opacity:.88}.badge{padding:8px 11px;border:1px solid #ffffff55;border-radius:999px;font-size:12px}
main{padding:20px 0 50px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #173b6710}
.row{display:flex;gap:10px;flex-wrap:wrap}.grow{flex:1;min-width:220px}
label{font-weight:700;display:block;margin-bottom:8px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px}
button{border:0;border-radius:11px;padding:12px 15px;background:var(--brand);color:white;font-weight:700;cursor:pointer}
button.secondary{background:#e8eef6;color:var(--brand)}button.accent{background:var(--accent)}
.status{font-size:13px;color:var(--muted);margin-top:10px}.result{white-space:pre-wrap;line-height:1.55;background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:16px;margin-top:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tool{background:#edf7ff;border:1px solid #cce9f5;color:#13506d;border-radius:999px;padding:7px 10px;font-size:13px}
.mic{font-size:20px}.log{font-family:monospace;font-size:12px;white-space:pre-wrap;background:#0d1726;color:#d9e7f5;border-radius:12px;padding:13px;min-height:70px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 0}
</style>
</head>
<body>
<header><div class="wrap">
<div><h1>🎓 NurseStudy AI</h1><p class="sub">Voice-first study assistant for nursing students</p></div>
<div class="badge">Alexa+ simulated experience</div>
</div></header>
<main class="wrap">
<div class="card">
<label for="topic">What do you want to study?</label>
<div class="row">
<div class="grow"><input id="topic" value="Anatomy" placeholder="e.g. Anatomy"></div>
<button class="accent mic" onclick="speakInput()">🎤 Speak</button>
</div>
<div class="row">
<button onclick="callTool('create_study_plan')">Create 7-Day Plan</button>
